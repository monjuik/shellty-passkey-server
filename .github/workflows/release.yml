name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate semantic version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable tag such as v0.9.0, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  integration:
    name: PostgreSQL and race tests
    needs: validate
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passkey_test
          POSTGRES_PASSWORD: passkey_test
          POSTGRES_DB: passkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passkey_test -d passkey_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://passkey_test:passkey_test@localhost:5432/passkey_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: amd64, runner: macos-15-intel}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: windows, goarch: amd64, runner: windows-2022}
          - {goos: windows, goarch: arm64, runner: windows-11-arm}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ needs.validate.outputs.version }}
      ARCHIVE: shellty-passkey-server_${{ needs.validate.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
      PACKAGE_DIR: shellty-passkey-server_${{ needs.validate.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build and package Unix archive
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_DIR/docs"
          go build -trimpath -ldflags="-s -w -X github.com/monjuik/shellty-passkey-server/app.version=$VERSION" -o "$PACKAGE_DIR/passkey-server" ./cmd/web
          test "$("$PACKAGE_DIR/passkey-server" --version)" = "passkey-server $VERSION"
          cp README.md LICENSE config.example.json "$PACKAGE_DIR/"
          cp docs/administration.md docs/api.md docs/local-development.md "$PACKAGE_DIR/docs/"
          tar -czf "$ARCHIVE" "$PACKAGE_DIR"
      - name: Build and package Windows archive
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:PACKAGE_DIR/docs" | Out-Null
          go build -trimpath "-ldflags=-s -w -X github.com/monjuik/shellty-passkey-server/app.version=$env:VERSION" -o "$env:PACKAGE_DIR/passkey-server.exe" ./cmd/web
          $version = & ".\$env:PACKAGE_DIR\passkey-server.exe" --version
          if ($version.Trim() -ne "passkey-server $env:VERSION") {
            throw "Unexpected binary version: $version"
          }
          Copy-Item README.md, LICENSE, config.example.json "$env:PACKAGE_DIR/"
          Copy-Item docs/administration.md, docs/api.md, docs/local-development.md "$env:PACKAGE_DIR/docs/"
          Compress-Archive -Path "$env:PACKAGE_DIR" -DestinationPath "$env:ARCHIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: shellty-passkey-server_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, integration, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: shellty-passkey-server_*
          path: dist
          merge-multiple: true
      - name: Create checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          cd dist
          mapfile -t archives < <(find . -maxdepth 1 -type f -name 'shellty-passkey-server_*' -printf '%f\n' | sort)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "Expected 6 release archives, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Shellty Passkey Server $GITHUB_REF_NAME" \
            --generate-notes
